name: Build SlimeGlue Legacy

on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags:
      - 'v*'

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  OUTPUT_NAME: "SF_SlimeGlue1.0.1.jar"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Paper 1.21.11 / Java 21 baseline
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace \
            -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT \
            -PpaperTargetJvm=21

      - name: Verify Paper 26.2 compatibility
        run: >-
          ./gradlew clean compileJava --no-daemon --stacktrace
          -PpaperApiVersion=26.2.build.112-stable
          -PpaperTargetJvm=25

      - name: Verify Paper 26.3 alpha compatibility
        run: >-
          ./gradlew clean compileJava --no-daemon --stacktrace
          -PpaperApiVersion=26.3-rc-3.build.1-alpha
          -PpaperTargetJvm=25

      - name: Build universal release JAR from 1.21.11 baseline
        run: >-
          ./gradlew clean build --no-daemon --stacktrace
          -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT
          -PpaperTargetJvm=21

      - name: Stage and verify versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="build/libs/${OUTPUT_NAME}"
          OUTPUT="dist/${OUTPUT_NAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$OUTPUT"
          test -s "$OUTPUT"
          jar tf "$OUTPUT" | grep -Fq 'plugin.yml'
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: '${LEGACY_ARTIFACT_VERSION}'" || \
            unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"
          python3 - <<'PY'
          import pathlib, struct, zipfile
          jar = pathlib.Path('dist') / 'SF_SlimeGlue1.0.1.jar'
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY
          sha256sum "$OUTPUT"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${LEGACY_ARTIFACT_VERSION}"
          fi
          NOTES="SlimeGlue 1.0.1 adds Paper 26.3 alpha compatibility validation while preserving the Paper 1.21.11 / Java 21 universal release baseline and Paper 26.2 as the primary production target. Gradle now emits SF_SlimeGlue1.0.1.jar directly."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_SlimeGlue $TAG"
          fi
