name: Build SlimeGlue Legacy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"
  OUTPUT_NAME: "SF_SlimeGlue1.0.0.jar"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --stacktrace

      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="build/libs/SF_SlimeGlue_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          OUTPUT="dist/${OUTPUT_NAME}"
          test -s "$SOURCE"
          cp "$SOURCE" "$OUTPUT"
          test -s "$OUTPUT"
          echo "Built: $OUTPUT"
          sha256sum "$OUTPUT"
          jar tf "$OUTPUT" | grep -Fq 'plugin.yml'
          unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: '${LEGACY_ARTIFACT_VERSION}'" || \
            unzip -p "$OUTPUT" plugin.yml | grep -Fq "version: ${LEGACY_ARTIFACT_VERSION}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_SlimeGlue${{ env.LEGACY_ARTIFACT_VERSION }}
          path: dist/${{ env.OUTPUT_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${LEGACY_ARTIFACT_VERSION}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "SF_SlimeGlue $TAG"
          fi
