name: Build SlimeGlue Legacy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --stacktrace

      - name: Upload server JAR
        uses: actions/upload-artifact@v7
        with:
          name: SF_SlimeGlue_Legacy_v1.0.0
          path: build/libs/SF_SlimeGlue_Legacy_v1.0.0.jar
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/SF_SlimeGlue_Legacy_v1.0.0.jar
          generate_release_notes: true
