import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
}

group = 'com.xzavier0722.mc.plugin'
version = '1.0.0'
description = 'Slimefun Legacy compatibility bridge for other Minecraft plugins'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.elmakers.com/repository/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'codeMcQuickShop'
                url = 'https://repo.codemc.io/repository/maven-public/'
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule 'org.maxgamer', 'QuickShop'
        }
    }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
    maven { url = 'https://ci.nyaacat.com/maven/' }
}

dependencies {
    // Paper 26.2 publishes JVM 25 API classes. Resolve that build-time API while
    // still compiling this addon to Java 21 bytecode for Slimefun addon compatibility.
    compileOnly('io.papermc.paper:paper-api:26.2.build.+') {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }

    // Slimefun Legacy preserves the Slimefun4 API/package surface. Use a modern
    // public Slimefun API artifact for compilation; Slimefun itself is never bundled.
    compileOnly 'com.github.SlimefunGuguProject:Slimefun4:2025.1'

    compileOnly 'com.github.cryptomorin:kingdoms:1.16.20.5:all'
    compileOnly 'com.ghostchu:quickshop-bukkit:6.2.0.11:shaded'
    compileOnly('org.maxgamer:QuickShop:5.1.2.5') {
        transitive = false
    }
    compileOnly('com.elmakers.mine.bukkit:MagicAPI:10.2') {
        transitive = false
    }
    compileOnly 'me.crafter.mc:lockettepro:2.16'

    // Keep this aligned with Slimefun Legacy's embedded compatibility library.
    compileOnly 'com.github.Xzavier0722:SlimefunCompLib:b7a2bd8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def properties = [version: project.version]
    inputs.properties properties
    filesMatching('plugin.yml') {
        expand properties
    }
}

jar {
    archiveFileName = "SF_SlimeGlue_Legacy_v${project.version}.jar"
}
